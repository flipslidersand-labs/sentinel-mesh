name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go-collector:
    # main 直参照だと qa-workflows 側の変更が無警告で波及するため commit SHA に固定
    # (2026-09-13 時点の master HEAD, Dependabot で更新PRを追跡: flipslidersand-labs/sentinel-mesh#148)
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@4698972d73a1ca94088c0301899b93183ee1d90f
    with:
      go-version: "1.26"
      working-directory: go-collector
      # 引き上げ追跡: flipslidersand-labs/sentinel-mesh#141 (段階的引き上げの運用ルールを規定)
      # 2026-09-14: CI実測 57.9% (go test -race -covermode=atomic ./... 、qa-workflows/go-test.yml
      # と同一コマンド)に対する引き上げ値（実測値-5pt程度）。internal/pb(生成コード)・internal/otel
      # がテストファイル無しでもcoverage.outに0%として算入されるため、これらを除外したローカル
      # `go tool cover`集計(72.9%)より低く出る。閾値変更時は必ずCI実測値で検証すること
      # （ローカル環境がcovdataツール欠如でpb/otelを暗黙に除外し得るため:
      # errors/tooling/go-toolchain-missing-covdata-local-coverage-mismatch.md）。
      coverage-threshold: 52
      # 公開リポのため runner はリポ変数 GATE_RUNNER で指定する（ADR-010。既定値なし）。
      runner: ${{ vars.GATE_RUNNER }}

  rust-agent:
    name: Rust Agent (check + test + coverage)
    # 公開リポのため runner はリポ変数 GATE_RUNNER で指定する（ADR-010。既定値なし）。
    runs-on: ${{ vars.GATE_RUNNER }}
    # ハング時に GitHub-hosted のデフォルト360分を消費しないよう上限を設定
    # (実測時間+余裕。トラッキング: flipslidersand-labs/sentinel-mesh#146)
    timeout-minutes: 10
    # romeovs/lcov-reporter-action が PR にカバレッジコメントを投稿するために必要。
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: rust-agent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-agent
      # build.rs (tonic-build) が proto をコンパイルするため protoc が必要
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # cc の有無は GATE_RUNNER の値で変わる。GitHub 提供の runner は cc ありなので
      # apt を走らせない（外部ミラーの一時障害で落ちないように）。self-hosted
      # (linux-general) の actions-runner:latest には cc が無くリンクに失敗するため、
      # cc が無いときだけ build-essential をインストールする。
      - run: command -v cc >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y build-essential)
      - run: cargo check --workspace
      - run: cargo test --workspace
      - uses: taiki-e/install-action@cargo-llvm-cov
      # 現状実測ラインカバレッジ 55.26% (2026-09-13, agent crate のみ。
      # agent-ebpf は workspace member 外のため対象外) に対する初期閾値。
      # 引き上げ追跡: flipslidersand-labs/sentinel-mesh#141 と同様の運用ルールを適用し、
      # 閾値を上げるたびに本コメントの実測値も更新すること。
      - name: Coverage (fail under 50%)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 50
      - name: PR coverage comment
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: rust-agent/lcov.info
          title: "rust-agent coverage"
    # 注: agent-ebpf は nightly + bpf-linker + bpfel target が必要なため CI 対象外。
    #     実 eBPF 経路の検証は別 Issue で環境整備後に追加する。

  integration:
    name: Integration Test (Collector + Agent)
    needs: [go-collector, rust-agent]
    runs-on: ${{ vars.GATE_RUNNER }}
    # test-integration.sh はバックグラウンドプロセスを起動して待つため、ハング時に
    # デフォルトの360分を消費しないよう上限を設定（rust-agent の10分に余裕を足した値。
    # トラッキング: flipslidersand-labs/sentinel-mesh#216）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-agent
      # build.rs (tonic-build) が proto をコンパイルするため protoc が必要
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # cc の有無は GATE_RUNNER の値で変わる。GitHub 提供の runner は cc ありなので
      # apt を走らせない（外部ミラーの一時障害で落ちないように）。self-hosted
      # (linux-general) の actions-runner:latest には cc が無くリンクに失敗するため、
      # cc が無いときだけ build-essential をインストールする。
      - run: command -v cc >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y build-essential)
      # test-integration.sh は release バイナリを
      # target/x86_64-unknown-linux-gnu/release/sentinel-agent から起動するため、
      # ターゲットを明示して release ビルドする。
      - run: cargo build --release --target x86_64-unknown-linux-gnu -p sentinel-agent
        working-directory: rust-agent
      - run: ./test-integration.sh
    # 注: agent-ebpf(--features ebpf) は nightly + bpf-linker + bpfel target が必要なため
    #     ここでは対象外。mock モード (--mock) での REST API/gRPC 結合検証のみ行う。

  web:
    # main 直参照だと qa-workflows 側の変更が無警告で波及するため commit SHA に固定
    # (2026-09-13 時点の master HEAD, Dependabot で更新PRを追跡: flipslidersand-labs/sentinel-mesh#148)
    uses: flipslidersand-labs/qa-workflows/.github/workflows/node-test.yml@4698972d73a1ca94088c0301899b93183ee1d90f
    with:
      node-version: "22"
      package-manager: "npm"
      working-directory: web

  gitleaks:
    permissions:
      contents: read
    # main 直参照だと qa-workflows 側の変更が無警告で波及するため commit SHA に固定
    # (2026-09-13 時点の master HEAD, Dependabot で更新PRを追跡: flipslidersand-labs/sentinel-mesh#148)
    uses: flipslidersand-labs/qa-workflows/.github/workflows/gitleaks.yml@4698972d73a1ca94088c0301899b93183ee1d90f
