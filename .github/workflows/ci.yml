name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go-collector:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@main
    with:
      go-version: "1.25"
      working-directory: go-collector
      # 引き上げ追跡: flipslidersand-labs/sentinel-mesh#141 (段階的引き上げの運用ルールを規定)
      coverage-threshold: 40   # 現状実測 43.0% に合わせた初期値。段階的に引き上げる（閾値変更時は本コメントの実測値も更新すること）
      # self-hosted (linux-general) の actions-runner:latest イメージに build-essential が
      # 無く cgo(-race) が失敗するため一時的に GitHub-hosted に固定。
      # infra 側でランナーイメージ修正後に外す（トラッキング: flipslidersand-labs/sentinel-mesh#112）。
      runner: ubuntu-latest

  rust-agent:
    name: Rust Agent (check + test + coverage)
    # self-hosted (linux-general) の一部 Pod で ~/.cargo/bin の Permission denied が
    # 継続発生し dtolnay/rust-toolchain が失敗するため一時的に GitHub-hosted に固定。
    # infra 側で原因調査後に外す（トラッキング: flipslidersand-labs/dev-platform#1065）。
    runs-on: ubuntu-latest
    # romeovs/lcov-reporter-action が PR にカバレッジコメントを投稿するために必要。
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: rust-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-agent
      # build.rs (tonic-build) が proto をコンパイルするため protoc が必要
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # self-hosted (linux-general) の actions-runner:latest イメージに cc が無く
      # リンクに失敗するため build-essential を明示インストール。
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: cargo check --workspace
      - run: cargo test --workspace
      - uses: taiki-e/install-action@cargo-llvm-cov
      # 現状実測ラインカバレッジ 55.26% (2026-09-13, agent crate のみ。
      # agent-ebpf は workspace member 外のため対象外) に対する初期閾値。
      # 引き上げ追跡: flipslidersand-labs/sentinel-mesh#141 と同様の運用ルールを適用し、
      # 閾値を上げるたびに本コメントの実測値も更新すること。
      - name: Coverage (fail under 50%)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 50
      - name: PR coverage comment
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: rust-agent/lcov.info
          title: "rust-agent coverage"
    # 注: agent-ebpf は nightly + bpf-linker + bpfel target が必要なため CI 対象外。
    #     実 eBPF 経路の検証は別 Issue で環境整備後に追加する。

  web:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/node-test.yml@main
    with:
      node-version: "22"
      package-manager: "npm"
      working-directory: web

  gitleaks:
    permissions:
      contents: read
    uses: flipslidersand-labs/qa-workflows/.github/workflows/gitleaks.yml@main
