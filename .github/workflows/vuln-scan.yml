name: Vulnerability scan

# 既知脆弱性 (GO- / RUSTSEC / GHSA) を持つ依存の検知 (#312)。
# 非必須チェック: 各ジョブは continue-on-error: true で、失敗しても PR をブロックしない。
# 既存検出の整理後に必須化を検討する。ci.yml の required checks には含めないこと。
# ツール取得ステップとスキャンステップは分離している。
# 「Install ...」が失敗 = ネットワーク等の取得失敗、「Scan ...」が失敗 = 脆弱性検出。
on:
  schedule:
    - cron: "17 3 * * 1" # 毎週月曜 03:17 UTC
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/vuln-scan.yml"
      - "go-collector/go.mod"
      - "go-collector/go.sum"
      - "rust-agent/Cargo.lock"
      - "rust-agent/**/Cargo.toml"
      - "web/package-lock.json"
      - "web/package.json"

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vuln scan (go-collector, non-blocking)
    # 公開リポのため runner はリポ変数 GATE_RUNNER で指定する（ADR-010。既定値なし）。
    runs-on: ${{ vars.GATE_RUNNER }}
    continue-on-error: true
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go-collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.26"
      - name: Install govulncheck (失敗 = ツール取得失敗)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan go-collector (失敗 = 脆弱性検出)
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./... || { echo "::error::govulncheck が脆弱性を検出"; exit 1; }

  cargo-deny:
    name: Vuln scan (rust-agent, non-blocking)
    runs-on: ${{ vars.GATE_RUNNER }}
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install cargo-deny (失敗 = ツール取得失敗)
        run: |
          command -v cc >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y build-essential)
          cargo install cargo-deny --locked --version 0.20.2
      - name: Scan rust-agent advisories (失敗 = 脆弱性検出)
        # licenses は deny.toml の許可リスト整備が前提のため本 PR では対象外。advisories のみ。
        run: cargo deny check advisories || { echo "::error::cargo deny が advisory を検出"; exit 1; }

  npm-audit:
    name: Vuln scan (web, non-blocking)
    runs-on: ${{ vars.GATE_RUNNER }}
    continue-on-error: true
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Scan web (失敗 = 脆弱性検出 または registry 到達不可)
        # package-lock.json のみを対象にし、依存はインストールしない。
        run: npm audit --package-lock-only --audit-level=high
