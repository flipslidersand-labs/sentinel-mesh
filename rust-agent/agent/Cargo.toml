[package]
name = "sentinel-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/flipslidersand-labs/sentinel-mesh"

[features]
# Enable real eBPF loading. Requires:
#   1. sudo apt install llvm-18-dev
#   2. cargo install bpf-linker --no-default-features
#   3. cargo +nightly build -p sentinel-agent-ebpf \
#          --target bpfel-unknown-none -Z build-std=core \
#          --manifest-path ../agent-ebpf/Cargo.toml
#      (agent-ebpf's dev profile is optimized like release, as the verifier rejects an unoptimized object; #569)
#   4. Run as root or with CAP_BPF
ebpf = ["dep:aya"]

[dependencies]
aya          = { version = "0.13", features = ["async_tokio"], optional = true }
tokio        = { workspace = true }
tonic        = { workspace = true }
prost        = { workspace = true }
tonic-prost  = { workspace = true }
anyhow       = { workspace = true }
clap         = { workspace = true }
hostname     = { workspace = true }
uuid         = { workspace = true }

[dev-dependencies]
async-stream = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14"
